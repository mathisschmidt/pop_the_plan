# Builds the image and runs it. One service, one volume, nothing else.
#
# Portainer: deploy this as a stack from the Git repository — "Repository" as
# the build method, not the web editor. A pasted compose file has no source
# tree, so `build:` below has nothing to build from. Set the variables under
# the stack's Environment section.
#
# Plain compose:
#   cp .env.production.example .env && $EDITOR .env
#   docker compose up -d --build
#
# The app serves plain HTTP. Put your own reverse proxy in front of it if you
# are exposing it to the internet.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pop-the-plan:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      # The database and the pictures live on the volume, not in the image.
      DATABASE_PATH: /data/pop-the-plan.db
      UPLOAD_DIR: /data/uploads

      # The public URL, scheme included, no trailing slash. Used for CSRF
      # checks and Secure cookies: wrong or missing and every form (login
      # included) is rejected.
      ORIGIN: ${ORIGIN:?required — the public URL, e.g. https://pop.example.com}

      # First boot only (min. 8 characters); ignored once the database exists.
      # Change it afterwards in the dashboard (Settings > My password).
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-change-me-please}

    volumes:
      # The SQLite file and the ring pictures. Losing this loses everything.
      - pop-the-plan-data:/data

    # Published on every interface so a phone on the same network can reach it.
    # Set BIND_ADDRESS=127.0.0.1 if a reverse proxy on this host is the only
    # thing that should talk to it.
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000'

    # The image defines the check; this repeats it so the stack reacts to it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

# SQLite is a single writer against a single file — never scale this service
# past one replica, and never point two stacks at the same volume.
volumes:
  pop-the-plan-data:
